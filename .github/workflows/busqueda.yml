name: Búsqueda automática de apartamento

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas (minuto 17 para evitar la congestión de la hora en punto)
  workflow_dispatch: {}       # botón "Run workflow" para buscar en cualquier momento

permissions:
  contents: write
  issues: write

concurrency:
  group: busqueda
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guardar el navegador en caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.48.2

      - name: Instalar Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Buscar en tucesion.com y Tu360
        run: node scripts/buscar.cjs

      - name: Guardar resultados
        run: |
          git config user.name "Sarita (robot de búsqueda)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NOVEDADES.md data/novedades.json data/vistos.json
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "Novedades de la búsqueda $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Avisar a mami y papi si hay opciones nuevas
        if: hashFiles('data/aviso.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n\n@%s' "${{ github.repository_owner }}" >> data/aviso.md
          gh issue create --title "Sarita encontró opciones nuevas ($(TZ=America/Bogota date '+%Y-%m-%d %H:%M'))" --body-file data/aviso.md
